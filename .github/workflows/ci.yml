name: CI

# The required check for pull requests into develop and main (branch protection). Broken code
# fails here, on the PR, rather than in the deploy. It runs on every pull request, whatever its
# base, so each PR in a stack is checked too.

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
